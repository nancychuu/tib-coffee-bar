<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Bar 核銷後台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--blue:#0B71BB;--deep:#063A8A;--beam:#78EBFF;--ink:#14244F;--muted:#5B6785;--line:#D9E2EF;--paper:#EEF2F7;
        --ok:#17A673;--okbg:#E6F7F0;--warn:#B45309;--warnbg:#FFF4E0;--bad:#C2264B;--badbg:#FDECEF}
  *{box-sizing:border-box} body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--paper);color:var(--ink)}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  header{background:linear-gradient(150deg,var(--blue),var(--deep));color:#fff;padding:16px 18px;border-radius:16px}
  header h1{margin:0;font-size:20px} header p{margin:4px 0 0;font-size:13px;color:#CFE3FF}
  .stats{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin-top:14px}
  .stat{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
  .stat b{display:block;font-size:22px;line-height:1.25;white-space:nowrap} .stat span{font-size:12px;color:#CFE3FF}
  .stat.main b{color:var(--beam);font-size:32px}
  .card{background:#fff;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 4px 18px rgba(6,58,138,.07)}
  .row{display:flex;gap:10px}
  input{flex:1;min-width:0;padding:14px;font:inherit;font-size:28px;font-weight:900;letter-spacing:10px;text-align:center;text-transform:uppercase;
        border:2px solid var(--line);border-radius:12px;color:var(--ink)}
  input:focus{outline:none;border-color:var(--blue)}
  button{font:inherit;font-weight:900;border:0;border-radius:12px;padding:14px 18px;font-size:17px;cursor:pointer;color:#fff;background:var(--blue)}
  button:disabled{opacity:.5}
  .big{width:100%;margin-top:14px;padding:18px;font-size:20px;background:var(--ok)}
  .res{border-radius:14px;padding:16px;margin-top:14px}
  .res h2{margin:0 0 8px;font-size:22px}
  .res.valid{background:var(--okbg);color:#0B6B49} .res.redeemed,.res.expired{background:var(--warnbg);color:var(--warn)}
  .res.none{background:var(--badbg);color:var(--bad)}
  dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;color:var(--ink);font-size:15px}
  dt{color:var(--muted)} dd{margin:0;font-weight:700}
  .msg{margin-top:12px;font-weight:700;min-height:1.2em}
  .hidden{display:none!important}
  .muted{color:var(--muted);font-size:13px}
  .pin input{letter-spacing:6px}
</style>
</head>
<body>
<div class="wrap">
  <section id="login" class="card pin">
    <h1 style="margin:0 0 6px;font-size:20px">Coffee Bar 核銷後台</h1>
    <p class="muted">請輸入工作人員 PIN</p>
    <div class="row"><input id="pin" type="password" inputmode="numeric" autocomplete="off"><button id="loginBtn">登入</button></div>
    <div class="msg" id="loginMsg" style="color:var(--bad)"></div>
  </section>

  <section id="app" class="hidden">
    <header>
      <h1>Coffee Bar 核銷後台</h1>
      <p id="nowText">—</p>
      <div class="stats">
        <div class="stat main"><b id="sRemain">—</b><span id="sRemainLabel">本場次剩餘份數</span></div>
        <div class="stat"><b id="sAm">—</b><span>上午 兌換／登記</span></div>
        <div class="stat"><b id="sPm">—</b><span>下午 兌換／登記</span></div>
      </div>
    </header>

    <div class="card">
      <div class="row">
        <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="兌換碼">
        <button id="checkBtn">查詢</button>
      </div>
      <div id="result"></div>
      <div class="msg" id="msg"></div>
    </div>
    <p class="muted" style="text-align:center">資料即時寫入 Google 試算表「登記資料」工作表</p>
  </section>
</div>

<script>
  const $ = id => document.getElementById(id);
  const API_URL = 'https://script.google.com/macros/s/AKfycbz5VZz0rs1FmXwGZawG1tIeCSmEHvyX70B4zKIJARJaVrtFURfV5eIDqi-f50SPo_rq6Q/exec';
  async function call(fn, ...args) {
    const body = { action: fn };
    if (fn === 'submitForm') body.data = args[0];
    else if (fn !== 'getStatus') { body.pin = args[0]; if (args.length > 1) body.code = args[1]; }
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), credentials: 'omit', redirect: 'follow' });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'error');
    return j.result;
  }
  let PIN = '';
  try { PIN = sessionStorage.getItem('cb_pin') || ''; } catch (e) {}
  if (PIN) login(PIN);

  $('loginBtn').onclick = () => login($('pin').value.trim());
  $('pin').addEventListener('keydown', e => { if (e.key === 'Enter') login($('pin').value.trim()); });

  async function login(pin) {
    $('loginMsg').textContent = '';
    try {
      const st = await call('adminLogin', pin);
      PIN = pin; try { sessionStorage.setItem('cb_pin', pin); } catch (e) {}
      $('login').classList.add('hidden'); $('app').classList.remove('hidden');
      renderStats(st); $('code').focus();
      setInterval(refresh, 30000);
    } catch (err) { $('loginMsg').textContent = err.message || 'PIN 錯誤'; try { sessionStorage.removeItem('cb_pin'); } catch (e) {} }
  }
  async function refresh() { try { renderStats(await call('adminStats', PIN)); } catch (e) {} }

  function renderStats(s) {
    $('nowText').textContent = `${s.date} ${s.time}｜${s.session ? s.session.name + '進行中（至 ' + s.session.end + '）' : '目前非兌換時段'}`;
    const cur = s.session ? s[s.session.id] : null;
    $('sRemain').textContent = cur ? Math.max(0, s.quota - cur.redeemed) : '—';
    $('sRemainLabel').textContent = s.session ? `${s.session.name}剩餘（共 ${s.quota}）` : '本場次剩餘份數';
    $('sAm').textContent = `${s.AM.redeemed} / ${s.AM.registered}`;
    $('sPm').textContent = `${s.PM.redeemed} / ${s.PM.registered}`;
  }

  $('code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  $('code').addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  $('checkBtn').onclick = check;

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function check() {
    const code = $('code').value.trim();
    $('msg').textContent = ''; $('result').innerHTML = '';
    if (code.length !== 4) { $('msg').textContent = '請輸入 4 碼兌換碼'; return; }
    $('checkBtn').disabled = true;
    try {
      const r = await call('verifyCode', PIN, code);
      if (!r.found) { $('result').innerHTML = `<div class="res none"><h2>❌ 查無此兌換碼</h2><p>請確認民眾畫面上的 4 碼是否輸入正確。</p></div>`; return; }
      const title = { valid: '✅ 有效，可兌換', redeemed: '⚠️ 已兌換過', expired: '⚠️ 已過期' }[r.state];
      const extra = r.state === 'redeemed' ? `<dt>兌換時間</dt><dd>${esc(r.redeemedAt)}</dd>` :
                    r.state === 'expired' ? `<dt>說明</dt><dd>僅限 ${esc(r.date)} ${esc(r.sessionName)}使用，請民眾點「重新送出」取得本場次新碼</dd>` : '';
      $('result').innerHTML = `<div class="res ${r.state}"><h2>${title}</h2><dl>
        <dt>兌換碼</dt><dd>${esc(r.code)}</dd><dt>姓名</dt><dd>${esc(r.name)}（手機末 3 碼 ${esc(r.phoneTail)}）</dd>
        <dt>公司</dt><dd>${esc(r.company)}</dd><dt>身分</dt><dd>${esc(r.identity)}</dd><dt>填寫語言</dt><dd>${esc(r.lang)}</dd>
        <dt>希望聯繫</dt><dd>${esc(r.contact)}</dd><dt>登記時間</dt><dd>${esc(r.registeredAt)}</dd>${extra}</dl>
        ${r.state === 'valid' ? '<button class="big" id="redeemBtn">確認兌換</button>' : ''}</div>`;
      if (r.state === 'valid') $('redeemBtn').onclick = () => redeem(r.code);
    } catch (err) { $('msg').textContent = err.message || '連線失敗，請再試一次'; }
    finally { $('checkBtn').disabled = false; }
  }

  async function redeem(code) {
    const b = $('redeemBtn'); b.disabled = true; b.textContent = '處理中…';
    try {
      const r = await call('redeemCode', PIN, code);
      if (r.ok) { $('result').innerHTML = `<div class="res valid"><h2>🎉 ${esc(r.msg)}</h2></div>`; renderStats(r.stats);
        $('code').value = ''; $('code').focus(); }
      else { $('msg').textContent = r.msg; b.disabled = false; b.textContent = '確認兌換'; }
    } catch (err) { $('msg').textContent = err.message || '連線失敗，請再試一次'; b.disabled = false; b.textContent = '確認兌換'; }
  }
</script>
</body>
</html>
