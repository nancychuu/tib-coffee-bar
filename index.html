<!DOCTYPE html>
<html lang="zh-Hant-TW" id="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tib Coffee Bar｜休憩補給站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0B71BB; --deep:#063A8A; --night:#04265E; --beam:#78EBFF;
    --ink:#14244F; --muted:#5B6785; --line:#D9E2EF; --paper:#F3F6FA; --pink:#E8458B; --ok:#17A673; --warn:#D97706;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--paper);color:var(--ink);
       -webkit-font-smoothing:antialiased;line-height:1.55}
  .hero{position:relative;overflow:hidden;color:#fff;padding:28px 22px 64px;
        background:linear-gradient(160deg,var(--blue) 0%,var(--deep) 70%,var(--night) 100%)}
  .beam{position:absolute;bottom:-40px;width:3px;height:420px;background:var(--beam);border-radius:3px;
        box-shadow:0 0 14px 3px rgba(120,235,255,.75);transform-origin:bottom;opacity:.85}
  .b1{right:22%;transform:rotate(24deg)} .b2{right:15%;transform:rotate(28deg);width:2px;opacity:.6}
  .b3{right:8%;transform:rotate(32deg);width:1.5px;opacity:.45}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 58%,rgba(255,255,255,.07) 58% 70%,transparent 70%)}
  .hero > *{position:relative;z-index:1}
  .logo{width:168px;display:block}
  h1{font-size:34px;font-weight:900;line-height:1.15;margin:26px 0 6px;letter-spacing:.5px}
  h1 small{display:block;font-size:20px;font-weight:700;color:var(--beam);margin-top:6px;letter-spacing:2px}
  .lead{margin:10px 0 0;font-size:15px;color:#DCEBFF}
  .pill{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 14px;border-radius:999px;
        background:rgba(255,255,255,.14);font-size:14px;font-weight:700}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--beam);box-shadow:0 0 8px var(--beam)}
  .pill.closed .dot{background:#FFC857;box-shadow:none}
  main{position:relative;z-index:2;padding:0 16px 40px;margin-top:-36px;max-width:520px;margin-left:auto;margin-right:auto}
  .step{background:#fff;border-radius:18px;padding:20px 18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(6,58,138,.08)}
  .step h2{display:flex;align-items:center;gap:10px;font-size:18px;margin:0 0 4px}
  .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-size:15px;
       display:grid;place-items:center}
  .step.done .num{background:var(--ok)}
  .hint{color:var(--muted);font-size:14px;margin:0 0 14px}
  .social{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .social a{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 8px;border-radius:12px;
            text-decoration:none;font-weight:700;font-size:15px;color:#fff}
  .fb{background:#1877F2}.li{background:#0A66C2}
  .social a.clicked{outline:3px solid var(--beam);outline-offset:1px}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px;cursor:pointer}
  .check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--blue);flex:none}
  .locked{opacity:.45;pointer-events:none;filter:grayscale(.3)}
  label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
  input[type=text],input[type=tel],input[type=email]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
        font:inherit;font-size:16px;color:var(--ink);background:#fff}
  input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,113,187,.15)}
  fieldset{border:0;padding:0;margin:16px 0 0}
  legend{font-weight:700;font-size:14px;margin-bottom:8px;padding:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips label{cursor:pointer}
  .chips input{position:absolute;opacity:0;pointer-events:none}
  .chips span{display:inline-block;padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;background:#fff}
  .chips input:checked + span{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:700}
  .chips input:focus-visible + span{box-shadow:0 0 0 3px rgba(11,113,187,.3)}
  details{margin-top:10px;font-size:13px;color:var(--muted);background:var(--paper);border-radius:10px;padding:10px 12px}
  details summary{cursor:pointer;font-weight:700;color:var(--ink)}
  details ol{padding-left:20px;margin:8px 0 0} details li{margin-bottom:6px}
  .btn{display:block;width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;font:inherit;font-size:17px;font-weight:900;
       color:#fff;background:linear-gradient(90deg,var(--blue),var(--deep));cursor:pointer}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .err{color:#C2264B;font-size:14px;font-weight:700;margin-top:12px;min-height:1em}
  .result{background:#fff;border-radius:18px;padding:26px 20px;text-align:center;box-shadow:0 6px 24px rgba(6,58,138,.08)}
  .result h2{margin:0;font-size:20px}
  .code{display:flex;justify-content:center;gap:10px;margin:20px 0 14px}
  .code span{width:58px;height:72px;border-radius:12px;display:grid;place-items:center;font-size:40px;font-weight:900;
             color:#fff;background:linear-gradient(170deg,var(--blue),var(--deep));box-shadow:0 0 0 3px rgba(120,235,255,.5)}
  .result p{margin:6px 0;color:var(--muted);font-size:15px}
  .result strong{color:var(--ink)}
  .notice{margin-top:14px;padding:12px;border-radius:10px;background:#FFF6E5;color:#8A4B00;font-size:14px;font-weight:700}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:6px 0 28px}
  .hidden{display:none!important}
  .lang{position:absolute;top:22px;right:18px;z-index:3;display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
  .lang button{border:0;background:transparent;color:#fff;font:inherit;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;cursor:pointer}
  .lang button[aria-pressed=true]{background:#fff;color:var(--deep)}
  .hours{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(6,58,138,.08);
         display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
  .hours dt{color:var(--muted)} .hours dd{margin:0;font-weight:700}
  .other{margin-top:10px}
  @media (prefers-reduced-motion:no-preference){ .beam{animation:glow 3.2s ease-in-out infinite alternate} .b2{animation-delay:.6s} .b3{animation-delay:1.2s}
    @keyframes glow{from{opacity:.35}to{opacity:.9}} }
</style>
</head>

const $ = id => document.getElementById(id);
const API_URL = 'https://script.google.com/macros/s/AKfycbz5VZz0rs1FmXwGZawG1tIeCSmEHvyX70B4zKIJARJaVrtFURfV5eIDqi-f50SPo_rq6Q/exec';
async function call(fn, ...args) {
  const body = { action: fn };
  if (fn === 'submitForm') body.data = args[0];
  else if (fn !== 'getStatus') { body.pin = args[0]; if (args.length > 1) body.code = args[1]; }
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), credentials: 'omit', redirect: 'follow' });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j.result;
}
const todayKey = () => 'tibcb_' + new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });

let LANG = 'zh';
try { LANG = localStorage.getItem('tibcb_lang') || ((navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en'); } catch (e) {}
let STATUS = null, RESULT = null, LAST_ERR = null;
const t = () => T[LANG];

function applyLang() {
  $('html').lang = LANG === 'zh' ? 'zh-Hant-TW' : 'en';
  document.querySelectorAll('[data-i]').forEach(el => {
    const v = t()[el.dataset.i]; if (typeof v !== 'string') return;
    if (el.dataset.html) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = t()[el.dataset.ph]);
  $('privBody').innerHTML = t().priv;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  if (!$('submitBtn').disabled) $('submitBtn').textContent = t().submit;
  renderPill(); if (RESULT) showResult(RESULT); renderErr();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  LANG = b.dataset.lang; try { localStorage.setItem('tibcb_lang', LANG); } catch (e) {} applyLang();
});

function renderPill() {
  const pill = $('pill'), el = $('pillText');
  if (STATUS === null) { el.textContent = t().loading; return; }
  if (STATUS === false) { el.textContent = t().quotaPill; return; }
  pill.classList.toggle('closed', !STATUS.open);
  if (STATUS.open) el.textContent = t().open(t()[STATUS.session.id], STATUS.remaining);
  else if (!STATUS.isEventDay) el.textContent = t().notEvent;
  else el.textContent = STATUS.next ? t().opensAt(t()[STATUS.next.id], STATUS.next.start) : t().ended;
}
function renderErr() {
  if (!LAST_ERR) { $('err').textContent = ''; return; }
  const e = t().err[LAST_ERR.key];
  $('err').textContent = typeof e === 'function' ? e(t().opensAt(t()[LAST_ERR.next.id], LAST_ERR.next.start)) : (e || t().err.network);
}
function setErr(key, next) { LAST_ERR = key ? { key, next } : null; renderErr(); }

try { const saved = JSON.parse(localStorage.getItem(todayKey()) || 'null'); if (saved && saved.code) RESULT = saved; } catch (e) {}
applyLang();
if (RESULT) showResult(RESULT);

call('getStatus').then(s => { STATUS = s; renderPill(); }).catch(() => { STATUS = false; renderPill(); });

['fbBtn', 'liBtn'].forEach(id => $(id).addEventListener('click', () => { $(id).classList.add('clicked'); $('followed').disabled = false; }));
$('followed').addEventListener('change', e => {
  $('step1').classList.toggle('done', e.target.checked);
  $('step2').classList.toggle('locked', !e.target.checked);
});
document.querySelectorAll('input[name="identity"]').forEach(r => r.addEventListener('change', () => {
  const other = radio('identity') === '其他';
  $('identityOther').classList.toggle('hidden', !other);
  if (other) $('identityOther').focus();
}));

function radio(n) { return (document.querySelector(`input[name="${n}"]:checked`) || {}).value || ''; }

$('step2').addEventListener('submit', async e => {
  e.preventDefault(); setErr(null);
  let identity = radio('identity');
  if (identity === '其他') {
    const o = $('identityOther').value.trim();
    if (!o) { setErr('otherEmpty'); return; }
    identity = '其他：' + o;
  }
  const data = {
    lang: LANG, followed: $('followed').checked, consent: $('consent').checked,
    identity, intent: radio('intent'), contact: radio('contact'),
    name: $('name').value.trim(), company: $('company').value.trim(),
    phone: $('phone').value.trim(), email: $('email').value.trim(),
  };
  if (!data.identity || !data.intent || !data.contact || !data.name || !data.company || !data.phone || !data.email) { setErr('incomplete'); return; }
  const digits = data.phone.replace(/\D/g, '');
  const okPhone = /^09\d{8}$/.test(digits) || (data.phone.startsWith('+') && digits.length >= 8 && digits.length <= 15);
  if (!okPhone) { setErr('phone'); return; }
  if (!data.consent) { setErr('consent'); return; }

  const btn = $('submitBtn'); btn.disabled = true; btn.textContent = t().sending;
  try {
    const r = await call('submitForm', data);
    if (r.ok) {
      RESULT = { code: r.code, sessionId: r.sessionId, sessionEnd: r.sessionEnd, status: r.status, note: r.note || '' };
      try { localStorage.setItem(todayKey(), JSON.stringify(RESULT)); } catch (err) {}
      showResult(RESULT);
    } else setErr(r.err, r.next);
  } catch (err) { setErr('network'); }
  finally { btn.disabled = false; btn.textContent = t().submit; }
});

$('resetLink').addEventListener('click', e => {
  e.preventDefault(); RESULT = null;
  try { localStorage.removeItem(todayKey()); } catch (err) {}
  $('resultView').classList.add('hidden'); $('formView').classList.remove('hidden');
});

function showResult(s) {
  $('formView').classList.add('hidden'); $('resultView').classList.remove('hidden');
  const box = $('codeBox'); box.innerHTML = '';
  String(s.code).split('').forEach(ch => { const sp = document.createElement('span'); sp.textContent = ch; box.appendChild(sp); });
  $('resTitle').textContent = s.status === 'redeemed' ? t().resRedeemed : t().resTitle;
  $('resSession').textContent = s.sessionId ? t().valid(t()[s.sessionId], s.sessionEnd) : '';
  const n = s.note ? t().err[s.note] : '';
  $('resNotice').textContent = n || ''; $('resNotice').classList.toggle('hidden', !n);
}
</script>
